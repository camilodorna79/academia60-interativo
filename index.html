<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>60+ Academia — Onde a força não tem idade</title>
<style>
/* ═══════════ RESET & BASE ═══════════ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --laranja:#f97316;--laranja-escuro:#ea580c;--laranja-claro:#fdba74;
  --grafite:#27272a;--grafite-suave:#3f3f46;--cinza:#71717a;
  --fundo:#fafaf9;--card:#ffffff;--borda:#e7e5e4;
  --verde:#16a34a;--ambar:#d97706;--azul:#2563eb;--roxo:#7c3aed;
  --sombra:0 1px 3px rgba(0,0,0,.08),0 4px 14px rgba(0,0,0,.06);
  --sombra-hover:0 6px 20px rgba(249,115,22,.18);
  --raio:14px;
}
html{scroll-behavior:smooth;scroll-padding-top:84px;overflow-x:hidden}
body{overflow-x:hidden;max-width:100vw}
img,svg,video,canvas{max-width:100%}
*{min-width:0}
#organogramaWrap,#freqGrid,.freq-grid,.tabela-scroll{max-width:100%;overflow-x:auto}
section,[id]{scroll-margin-top:82px}
body{
  font-family:'Segoe UI',system-ui,-apple-system,sans-serif;
  background:var(--fundo);color:var(--grafite);
  font-size:18px;line-height:1.6;
  min-height:100dvh;
  padding-bottom:76px; /* espaço da barra inferior */
}
img{max-width:100%;display:block}
.logo-embed svg{width:100%;height:auto;display:block}
.logo-original{width:min(100%,320px);height:auto;object-fit:contain;margin:0 auto;display:block}
footer .logo-original{width:150px}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input{font-family:inherit}

/* ═══════════ TELA DE ACESSO ═══════════ */
#telaAcesso{position:fixed;inset:0;z-index:1000;background:linear-gradient(160deg,#fff7ed 0%,#ffedd5 45%,#fed7aa 100%);display:flex;align-items:center;justify-content:center;padding:max(.5rem,env(safe-area-inset-top)) 1rem max(.5rem,env(safe-area-inset-bottom));overflow-y:auto}
.acesso-card{background:#fff;width:100%;max-width:520px;border-radius:24px;padding:2rem;box-shadow:0 16px 48px rgba(124,45,18,.18);text-align:center}
.acesso-card h1{font-size:1.8rem;color:#c2410c;margin:.8rem 0 .4rem}
.acesso-card p{color:#57534e;font-size:1rem;margin-bottom:1.2rem}
.acesso-card input[type=text]{width:100%;padding:.85rem 1rem;border:2px solid #fed7aa;border-radius:12px;font-size:1.1rem;margin-bottom:.8rem;outline:none}
.acesso-card input[type=text]:focus{border-color:var(--laranja)}
.acesso-card label.aceite-dados{display:flex;gap:.6rem;text-align:left;align-items:flex-start;font-size:.92rem;color:#44403c;margin:.7rem 0 1rem;line-height:1.5}
.acesso-card label input{margin-top:.25rem;width:20px;height:20px;accent-color:var(--laranja);flex-shrink:0}
.acesso-card button{width:100%;padding:.9rem;border-radius:12px;background:var(--laranja);color:#fff;font-size:1.08rem;font-weight:700;margin-top:.4rem;min-height:52px;transition:background .2s}
.acesso-card button:hover{background:var(--laranja-escuro)}
.acesso-card button:disabled{opacity:.55;cursor:wait}
#telaAcesso .logo-original{width:min(100%,330px);max-height:38vh}
#telaAcesso .aceite-dados{font-size:.88rem!important;line-height:1.45!important}
#telaAcesso .erro{font-size:.9rem!important}

/* Organograma — acesso progressivo e controles acessíveis para 60+ */
.org-preview{width:100%;min-height:88px;display:flex;align-items:center;gap:1rem;padding:1rem 1.1rem;margin:.35rem 0 1rem;border:2px solid #fed7aa;border-radius:18px;background:linear-gradient(125deg,#fff7ed,#ffedd5);color:#3f3f46;text-align:left;box-shadow:0 8px 24px rgba(249,115,22,.16);cursor:pointer;touch-action:manipulation}
.org-preview:focus-visible{outline:4px solid #2563eb;outline-offset:3px}
.org-preview-icon{font-size:2.3rem;animation:orgNudge 2.8s ease-in-out infinite}
.org-preview-copy{display:flex;flex-direction:column;gap:.2rem;flex:1}.org-preview-copy strong{font-size:1.08rem}.org-preview-copy small{font-size:.93rem;color:#57534e}.org-preview-arrow{font-size:1.8rem;color:#c2410c;transition:transform .2s}
.org-preview[aria-expanded="true"] .org-preview-arrow{transform:rotate(180deg)}
@keyframes orgNudge{0%,84%,100%{transform:rotate(0)}86%{transform:translateX(-3px) rotate(-5deg)}88%{transform:translateX(3px) rotate(5deg)}90%{transform:translateX(-2px) rotate(-3deg)}92%{transform:translateX(2px) rotate(3deg)}94%{transform:none}}
@media(prefers-reduced-motion:reduce){.org-preview-icon{animation:none}}
.fs-controles button{min-width:60px;min-height:60px;font-size:1.25rem;touch-action:manipulation}
#organograma:fullscreen,#organograma.org-fullscreen-fallback{width:100vw!important;height:100dvh!important;box-sizing:border-box!important;padding:calc(env(safe-area-inset-top) + 8px) 8px calc(env(safe-area-inset-bottom) + 8px)!important;overflow:auto!important}
@media(max-width:700px){.org-toolbar{position:sticky;top:48px;z-index:9;background:#fff;padding:.35rem 0}.org-toolbar button{min-height:52px;font-size:.9rem}.ramo-areas{grid-template-columns:repeat(2,minmax(0,1fr));gap:.4rem}.org-no{min-width:0;max-width:100%;overflow-wrap:anywhere}.org-no .cargo{font-size:.84rem}.org-no .obs{font-size:.72rem}.fs-controles button{min-width:60px;min-height:60px;font-size:1.35rem}.org-preview{min-height:96px}}
@media(max-width:420px) and (orientation:portrait){.ramo-areas{grid-template-columns:1fr}.org-no .cargo{font-size:.92rem}}
@media(orientation:landscape) and (max-height:560px){.ramo-areas{grid-template-columns:repeat(4,minmax(0,1fr));gap:.3rem}.org-no{padding:.35rem;min-width:0}.org-no .cargo{font-size:.78rem}.org-no .obs{font-size:.68rem}}
</style>
</head>
<body>
